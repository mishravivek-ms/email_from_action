name: Notify on Completion

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Custom message for email"
        required: false
        default: "Workflow triggered manually"

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "GitHub Action Completed"
          to: mishravivek@microsoft.com
          from: vivekmishra2001@gmail.com
          body: |
            Workflow "${{ github.workflow }}" has completed.
            Status: ${{ github.event.workflow_run.conclusion }}
